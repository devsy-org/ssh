version: "2"
run:
  timeout: 5m
  concurrency: 8
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
linters:
  enable:
    - errcheck
    - gocritic
    - godot
    - gosec
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
