name: OpenSSH Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openssh-integration:
    name: OpenSSH Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify OpenSSH client
        run: ssh -V
      - name: Run OpenSSH compatibility suite
        run: go test -count=1 -tags=openssh_integration ./...
